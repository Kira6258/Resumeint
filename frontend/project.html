<!DOCTYPE html>
<html lang="en">

<body class="animate-in">

        <div class="max-width-container nav-content">
            <div class="nav-group">
                <a href="index.html" class="logo">Resumeint</a>
                <button class="mobile-nav-toggle" id="mobile-toggle">☰</button>
                <div class="nav-links-wrapper" id="mobile-menu">
                    <a href="dashboard.html" class="nav-link" id="nav-dashboard">Dashboard</a>

                    <a href="register.html" class="btn btn-primary btn-small">Get Started</a>
                </div>
                <a href="profile.html" class="nav-avatar-link">
                    <div id="user-avatar" class="nav-avatar">U</div>

            </div>

    <main id="project-container" class="max-width-container" style="padding-top: var(--space-80);">
        <!-- Content dynamically injected -->
    </main>
    <script src="js/app.js"></script>
    <script>
        let projectData = null;
        async function loadProject() {
            const container = document.getElementById('project-container');
            container.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; gap:24px;">
                    <div style="width:40px; height:40px; border:3px solid var(--border-muted); border-top-color:var(--accent-gold); border-radius:50%; animation:spin 1s linear infinite;"></div>
                    <p style="color:var(--text-secondary); font-family:var(--font-display);">Decoding Architecture...</p>
                </div>
            `;

            try {
                const id = new URLSearchParams(window.location.search).get('id');
                if (!id) throw new Error("No project ID found");

                const res = await fetchWithAuth(`/api/projects/${id}`);
                if (!res.ok) throw new Error("Failed to fetch project");

                projectData = await res.json();
                renderProject();
            } catch (err) {
                console.error("Load Project Error:", err);
                container.innerHTML = `
                    <div style="text-align:center; padding:var(--space-80) var(--space-32);">
                        <div style="font-size:3rem; margin-bottom:24px;">🚧</div>
                        <h2 style="font-family:var(--font-display); margin-bottom:12px;">Roadmap Unreachable</h2>
                        <p style="color:var(--text-secondary); margin-bottom:32px;">${err.message || "We couldn't retrieve your architecture blueprint."}</p>
                        <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
                    </div>
                `;
                showToast("Error", "Could not load roadmap.", "error");
            }
        }
        function renderProject() {
            const p = projectData;
            const container = document.getElementById('project-container');
            
            // Safety: Handle missing or invalid roadmap data
            const roadmap = p.roadmap_data || [];
            if (!Array.isArray(roadmap) || roadmap.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:var(--space-80) var(--space-32);">
                        <div style="font-size:3rem; margin-bottom:24px;">🧪</div>
                        <h2 style="font-family:var(--font-display); margin-bottom:12px;">Empty Architecture</h2>
                        <p style="color:var(--text-secondary); margin-bottom:32px;">This project doesn't have a roadmap yet. Try regenerating it.</p>
                        <a href="upload.html" class="btn btn-primary">Create New Project</a>
                    </div>
                `;
                return;
            }

            const progress = p.milestone_progress || {};
            container.innerHTML = `
                <header class="fade-up" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-64);">
                    <div>
                        <div class="sticker-badge" style="margin-bottom: var(--space-16);">${p.course_name}</div>
                        <h1 style="font-size: 2.5rem; font-family: var(--font-display); font-weight: 800;">${p.title}</h1>
                        <p style="color: var(--text-secondary); margin-top: 8px;">Architecting the next phase of your engineering portfolio.</p>
                    </div>
                    <div style="display: flex; gap: var(--space-16); flex-wrap: wrap;">
                        <a href="checkin.html?id=${p.id}" class="btn btn-primary">📝 Weekly Check-in</a>
                        <button onclick="syncGitHub()" class="btn btn-outline">🐙 Sync GitHub</button>
                        <button onclick="downloadScaffold()" class="btn btn-outline" style="border-color: var(--accent-gold); color: var(--accent-gold);">⚡ Download Workspace</button>
                    </div>
                </header>
                <div style="display: grid; grid-template-columns: 1fr 340px; gap: var(--space-48);" class="fade-up stagger-1">
                    <div class="roadmap-main">
                        <h2 style="font-size: 1.25rem; font-family: var(--font-display); margin-bottom: var(--space-32); display: flex; align-items: center; gap: 16px;">
                            📋 Implementation Pipeline
                            <div style="flex-grow: 1; height: 1px; background: var(--border-default);"></div>
                        </h2>
                        ${roadmap.map(w => `
                            <div class="bento-card fade-up" style="margin-bottom: var(--space-32); padding: var(--space-40); transition-delay: ${w.week * 0.1}s">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-24);">
                                    <div>
                                        <div style="font-weight: 800; color: var(--accent-gold); font-size: 0.7rem; margin-bottom: 4px; letter-spacing: 0.1em;">WEEK ${w.week}</div>
                                        <h3 style="font-size: 1.4rem; font-family: var(--font-display);">${w.goal}</h3>
                                    </div>
                                    <span id="week-badge-${w.week}" class="sticker-badge" style="background: var(--bg-tertiary); margin: 0;">${(progress[String(w.week)] || []).length}/${(w.milestones || []).length} COMPLETE</span>
                                </div>
                                <div style="display: grid; gap: var(--space-12);">
                                    ${(w.milestones || []).map((m, i) => {
                                        const isDone = (progress[String(w.week)] || []).includes(i);
                                        return `
                                            <div id="milestone-${w.week}-${i}"
                                                 class="milestone-card"
                                                 style="padding: 16px 20px; border-radius: var(--radius-md); background: ${isDone ? 'rgba(212, 162, 78, 0.05)' : 'var(--bg-tertiary)'}; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: var(--transition-fast);"
                                                 onclick="toggleMilestone(${w.week}, ${i}, ${!isDone})">
                                                <div class="milestone-checkbox" style="flex-shrink:0; width: 20px; height: 20px; border: 2px solid ${isDone ? 'var(--accent-gold)' : 'var(--border-default)'}; border-radius: 6px; background: ${isDone ? 'var(--accent-gold)' : 'transparent'}; display: flex; align-items: center; justify-content: center; transition: var(--transition-fast);">
                                                    ${isDone ? '<span style="color: #000; font-size: 12px; font-weight: 900;">\u2713</span>' : ''}
                                                </div>
                                                <span class="milestone-label" style="font-size: 0.95rem; color: ${isDone ? 'var(--text-tertiary)' : 'var(--text-primary)'}; ${isDone ? 'text-decoration: line-through;' : ''}">${formatText(m)}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                                <div style="margin-top: var(--space-32); padding: 20px; background: rgba(212, 162, 78, 0.05); border-radius: var(--radius-lg); border: 1px solid rgba(212, 162, 78, 0.1);">
                                    <div style="font-weight: 800; font-size: 0.7rem; color: var(--accent-gold); margin-bottom: 8px; text-transform: uppercase;">📦 DELIVERABLE</div>
                                    <p style="margin: 0; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6;">${formatText(w.deliverable)}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="roadmap-sidebar stagger-2">
                        <div style="margin-bottom: var(--space-24);">
                            <a href="interview.html?id=${p.id}" class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; background: linear-gradient(135deg, var(--accent-gold) 0%, #f4d068 100%); color: #000; border: none; box-shadow: 0 4px 15px rgba(212,162,78,0.2); font-weight: 700; padding: 14px;">
                                🎙️ Grill Me (Mock Interview)
                            </a>
                        </div>
                        <div class="bento-card fade-up" style="margin-bottom: var(--space-24); padding: var(--space-24); min-height: 320px; display: flex; flex-direction: column;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-16); border-bottom: 1px solid var(--border-default); padding-bottom: 8px;">
                                <h4 style="font-family: var(--font-display); font-size: 0.95rem; margin: 0; display: flex; align-items: center; gap: 6px;">🛠️ Blueprint Hub</h4>
                                <div style="display: flex; gap: 4px;">
                                    <button class="blueprint-tab-btn active" id="tab-btn-tree" onclick="switchBlueprintTab('tree')">📂 Tree</button>
                                    <button class="blueprint-tab-btn" id="tab-btn-erd" onclick="switchBlueprintTab('erd')">🗄️ ERD</button>
                                </div>
                            </div>
                            <div id="blueprint-tree-content" class="blueprint-panel active">
                                ${renderRepoTree(p.repo_structure_data)}
                            </div>
                            <div id="blueprint-erd-content" class="blueprint-panel" style="display: none;">
                                ${renderERD(p.mysql_schema_sql)}
                            </div>
                        </div>
                        <div class="bento-card fade-up" style="padding: var(--space-24);">
                            <h4 style="font-family: var(--font-display); margin-bottom: var(--space-16); font-size: 1rem;">🧠 AI Mentor Tips</h4>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6;">Remember to follow semantic commit messages when syncing to GitHub. Use <code style="color: var(--accent-gold);">feat:</code> for milestones and <code style="color: var(--accent-gold);">docs:</code> for README updates.</p>
                        </div>
                    </div>
                </div>
            `;
            
            // CRITICAL: Initialize animations for newly injected elements
            if (typeof initAnimations === 'function') {
                initAnimations();
            }
        }
        async function toggleMilestone(week, idx, done) {
            // 1. Optimistic UI update — change the card instantly without a page reload
            const cardId = `milestone-${week}-${idx}`;
            const card = document.getElementById(cardId);
            if (card) {
                // Update card background
                card.style.background = done ? 'rgba(212, 162, 78, 0.05)' : 'var(--bg-tertiary)';

                // Update checkbox appearance
                const checkbox = card.querySelector('.milestone-checkbox');
                if (checkbox) {
                    checkbox.style.borderColor = done ? 'var(--accent-gold)' : 'var(--border-default)';
                    checkbox.style.background = done ? 'var(--accent-gold)' : 'transparent';
                    checkbox.innerHTML = done ? '<span style="color:#000;font-size:12px;font-weight:900;">\u2713</span>' : '';
                }

                // Update text style
                const label = card.querySelector('.milestone-label');
                if (label) {
                    label.style.color = done ? 'var(--text-tertiary)' : 'var(--text-primary)';
                    label.style.textDecoration = done ? 'line-through' : 'none';
                }

                // Update the onclick to toggle the other way next time
                card.onclick = () => toggleMilestone(week, idx, !done);
            }

            // 2. Update local progress state
            if (!projectData.milestone_progress) projectData.milestone_progress = {};
            const key = String(week);
            if (!projectData.milestone_progress[key]) projectData.milestone_progress[key] = [];
            const arr = projectData.milestone_progress[key];
            if (done) {
                if (!arr.includes(idx)) arr.push(idx);
            } else {
                const pos = arr.indexOf(idx);
                if (pos > -1) arr.splice(pos, 1);
            }

            // 3. Update the week badge counter
            const weekData = (projectData.roadmap_data || []).find(w => w.week === week);
            if (weekData) {
                const total = (weekData.milestones || []).length;
                const completed = (projectData.milestone_progress[key] || []).length;
                const badge = document.getElementById(`week-badge-${week}`);
                if (badge) badge.textContent = `${completed}/${total} COMPLETE`;
            }

            // 4. Persist to server in background (no page reload)
            try {
                const res = await fetchWithAuth(`/api/projects/${projectData.id}/milestones`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ week_number: week, milestone_index: idx, completed: done })
                });
                if (!res.ok) throw new Error('Server error');
            } catch (err) {
                // Rollback optimistic update on failure
                showToast("Error", "Failed to save milestone. Please try again.", "error");
                // Revert local state
                const arr2 = projectData.milestone_progress[String(week)] || [];
                if (done) {
                    const p = arr2.indexOf(idx); if (p > -1) arr2.splice(p, 1);
                } else {
                    if (!arr2.includes(idx)) arr2.push(idx);
                }
                // Revert card UI
                if (card) {
                    card.style.background = !done ? 'rgba(212, 162, 78, 0.05)' : 'var(--bg-tertiary)';
                    const checkbox = card.querySelector('.milestone-checkbox');
                    if (checkbox) {
                        checkbox.style.borderColor = !done ? 'var(--accent-gold)' : 'var(--border-default)';
                        checkbox.style.background = !done ? 'var(--accent-gold)' : 'transparent';
                        checkbox.innerHTML = !done ? '<span style="color:#000;font-size:12px;font-weight:900;">\u2713</span>' : '';
                    }
                    card.onclick = () => toggleMilestone(week, idx, done); // restore original
                }
            }
        }
        async function syncGitHub() {
            showToast("GitHub Sync", "Initializing repository...", "info");
            try {
                const res = await fetchWithAuth(`/api/projects/${projectData.id}/sync-github`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showToast("Success", "Repository synchronized.", "success");
                    window.open(data.repo_url, '_blank');
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showToast("Error", "Sync failed. Check GitHub integration.", "error");
            }
        }
        async function downloadScaffold() {
            showToast("Workspace Scaffolder", "Generating pre-configured starter files...", "info");
            try {
                const token = localStorage.getItem('Resumeint-token');
                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch(`/api/projects/${projectData.id}/scaffold`, {
                    method: 'GET',
                    headers: headers
                });
                
                if (!response.ok) {
                    throw new Error("Generation failed");
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                const cleanTitle = (projectData.title || 'project').toLowerCase().replace(/[^a-z0-9]/g, '-');
                a.download = `${cleanTitle}-scaffold.zip`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showToast("Success", "Starter workspace ZIP downloaded! Ready to open in VS Code.", "success");
            } catch (err) {
                console.error("Scaffold Download Error:", err);
                showToast("Error", "Failed to download starter workspace.", "error");
            }
        }
        function switchBlueprintTab(tabName) {
            const treeBtn = document.getElementById('tab-btn-tree');
            const erdBtn = document.getElementById('tab-btn-erd');
            const treeContent = document.getElementById('blueprint-tree-content');
            const erdContent = document.getElementById('blueprint-erd-content');
            
            if (!treeBtn || !erdBtn || !treeContent || !erdContent) return;
            
            if (tabName === 'tree') {
                treeBtn.classList.add('active');
                erdBtn.classList.remove('active');
                treeContent.style.display = 'block';
                erdContent.style.display = 'none';
            } else {
                treeBtn.classList.remove('active');
                erdBtn.classList.add('active');
                treeContent.style.display = 'none';
                erdContent.style.display = 'block';
            }
        }

        window.switchBlueprintTab = switchBlueprintTab;

        function toggleFolder(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('.folder-arrow');
            if (content.style.display === 'none') {
                content.style.display = 'flex';
                arrow.textContent = '▼';
            } else {
                content.style.display = 'none';
                arrow.textContent = '▶';
            }
        }

        window.toggleFolder = toggleFolder;

        function renderRepoTree(repoData) {
            if (!repoData || typeof repoData !== 'object' || Object.keys(repoData).length === 0) {
                return `<p style="color:var(--text-tertiary); font-size:0.85rem; margin:0;">No repository structure available.</p>`;
            }
            let html = `<div class="tree-container" style="display: flex; flex-direction: column; gap: var(--space-8);">`;
            for (const [folder, files] of Object.entries(repoData)) {
                html += `
                    <div class="tree-folder">
                        <div class="tree-folder-header" onclick="toggleFolder(this)">
                            <span class="folder-arrow">▼</span> 📁 <span class="folder-name">${folder}</span>
                        </div>
                        <div class="tree-folder-content">
                            ${Array.isArray(files) && files.length > 0 ? files.map(file => `
                                <div class="tree-file">📄 ${file}</div>
                            `).join('') : `<div class="tree-file-empty" style="color:var(--text-tertiary); font-size:0.75rem; padding-left:24px;">empty</div>`}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            return html;
        }

        function parseSQL(sqlText) {
            if (!sqlText) return [];
            
            const tables = [];
            const createTableRegex = /CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(\w+)\s*\(([\s\S]*?)\);/gi;
            let match;
            while ((match = createTableRegex.exec(sqlText)) !== null) {
                const tableName = match[1];
                const columnsText = match[2];
                const columns = [];
                const foreignKeys = [];
                
                const lines = [];
                let currentLine = "";
                let parenDepth = 0;
                for (let i = 0; i < columnsText.length; i++) {
                    const char = columnsText[i];
                    if (char === '(') parenDepth++;
                    else if (char === ')') parenDepth--;
                    
                    if (char === ',' && parenDepth === 0) {
                        lines.push(currentLine.trim());
                        currentLine = "";
                    } else {
                        currentLine += char;
                    }
                }
                if (currentLine.trim()) {
                    lines.push(currentLine.trim());
                }
                
                for (let line of lines) {
                    line = line.replace(/\s+/g, ' ').trim();
                    if (!line) continue;
                    
                    if (/FOREIGN\s+KEY/i.test(line)) {
                        const fkMatch = /FOREIGN\s+KEY\s*\(\s*(\w+)\s*\)\s*REFERENCES\s*(\w+)\s*\(\s*(\w+)\s*\)/i.exec(line);
                        if (fkMatch) {
                            foreignKeys.push({
                                column: fkMatch[1],
                                refTable: fkMatch[2],
                                refColumn: fkMatch[3]
                            });
                        }
                        continue;
                    }
                    if (/PRIMARY\s+KEY/i.test(line) && !line.includes('INT') && !line.includes('VARCHAR') && !line.includes('CHAR') && !line.includes('TEXT')) {
                        continue;
                    }
                    
                    const parts = line.split(' ');
                    if (parts.length < 2) continue;
                    
                    const colName = parts[0].replace(/[`"']/g, '');
                    const colType = parts[1];
                    
                    const isPk = /PRIMARY\s+KEY/i.test(line);
                    const isNullable = !/NOT\s+NULL/i.test(line);
                    const isUnique = /UNIQUE/i.test(line);
                    
                    columns.push({
                        name: colName,
                        type: colType,
                        isPk: isPk,
                        isNullable: isNullable,
                        isUnique: isUnique,
                        isFk: false,
                        refTable: null,
                        refColumn: null
                    });
                }
                
                for (let fk of foreignKeys) {
                    const col = columns.find(c => c.name.toLowerCase() === fk.column.toLowerCase());
                    if (col) {
                        col.isFk = true;
                        col.refTable = fk.refTable;
                        col.refColumn = fk.refColumn;
                    }
                }
                
                tables.push({
                    name: tableName.replace(/[`"']/g, ''),
                    columns: columns
                });
            }
            return tables;
        }

        function renderERD(sqlText) {
            if (!sqlText || !sqlText.trim()) {
                return `<p style="color:var(--text-tertiary); font-size:0.85rem; margin:0;">No SQL schema available for this architecture.</p>`;
            }
            const tables = parseSQL(sqlText);
            if (tables.length === 0) {
                return `<pre style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-gold); background: #000; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0;">${sqlText}</pre>`;
            }
            
            return `
                <div class="erd-container" style="display: flex; flex-direction: column; gap: var(--space-16); max-height: 400px; overflow-y: auto;">
                    ${tables.map(table => `
                        <div class="erd-table-card" style="background: rgba(255,255,255,0.01); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-16);">
                            <div class="erd-table-header" style="font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--accent-gold); border-bottom: 1px solid var(--border-muted); padding-bottom: var(--space-8); margin-bottom: var(--space-12); display: flex; align-items: center; gap: 6px;">
                                🗄️ ${table.name}
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                ${table.columns.map(col => `
                                    <div class="erd-column-row" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;">
                                        <div class="erd-col-name" style="font-family: var(--font-mono); color: var(--text-primary); display: flex; align-items: center; gap: 4px;">
                                            ${col.isPk ? '🔑' : (col.isFk ? '🔗' : '▫️')}
                                            <span>${col.name}</span>
                                            ${col.isPk ? '<span class="erd-badge erd-badge-pk" style="font-size: 0.6rem; font-weight: 800; padding: 1px 4px; border-radius: 3px; background: rgba(212, 162, 78, 0.15); color: var(--accent-gold); border: 1px solid rgba(212, 162, 78, 0.3);">PK</span>' : ''}
                                            ${col.isFk ? `<span class="erd-badge erd-badge-fk" style="font-size: 0.6rem; font-weight: 800; padding: 1px 4px; border-radius: 3px; background: rgba(48, 144, 240, 0.15); color: #30b0ff; border: 1px solid rgba(48, 144, 240, 0.3);" title="FK to ${col.refTable}.${col.refColumn}">FK</span>` : ''}
                                        </div>
                                        <span class="erd-col-type" style="font-family: var(--font-mono); color: var(--text-tertiary);">${col.type}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        loadProject();
    </script>
    <script>
        document.getElementById('mobile-toggle').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            const isOpen = menu.classList.toggle('active');
            this.textContent = isOpen ? '✕' : '☰';
