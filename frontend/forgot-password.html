<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Architecture Resumeint</title>
    <link rel="stylesheet" href="css/style.css?v=50.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body class="animate-in" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <main class="fade-up" style="max-width: 480px; width: 100%; padding: var(--space-24);">
        <div class="glass-card" style="padding: var(--space-64) var(--space-48); text-align: center;">
            <h1
                style="font-size: 1.75rem; font-family: var(--font-display); font-weight: 800; margin-bottom: var(--space-8);">
                Reset Password</h1>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-48); font-size: 0.95rem;">Enter your
                email to
                receive recovery instructions.</p>
            <form id="forgot-form" style="text-align: left;">
                <div style="margin-bottom: var(--space-40);">
                    <label
                        style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: var(--space-8);">Email
                        Address</label>
                    <input type="email" id="forgot-email" class="form-input" placeholder="architect@example.com"
                        required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; height: 56px; font-size: 1.1rem;">Send
                    Recovery Email</button>
            </form>
            <div style="margin-top: var(--space-48); font-size: 0.9rem; color: var(--text-secondary);">
                Remembered it? <a href="login.html" style="color: var(--accent-gold); font-weight: 800;">Back to
                    Login</a>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            setButtonLoading(btn, true, "Processing...");
            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgot-email').value })
                });
                if (res.ok) {
                    showToast("Success", "Instructions sent to your inbox.", "success");
                } else {
                    const err = await res.json();
                    showToast("Error", err.detail || "Failed to send email.", "error");
                }
            } catch (err) {
                showToast("Error", "Check your connection.", "error");
            } finally {
                setButtonLoading(btn, false);
            }
        });
    </script>
</body>

</html>
