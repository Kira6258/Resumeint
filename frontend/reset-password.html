<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Architecture — Resumeint</title>
    <link rel="stylesheet" href="css/style.css?v=50.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body class="animate-in" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <main class="fade-up" style="max-width: 480px; width: 100%; padding: var(--space-24);">
        <div class="glass-card" style="padding: var(--space-64) var(--space-48); text-align: center;">
            <h1
                style="font-size: 1.75rem; font-family: var(--font-display); font-weight: 800; margin-bottom: var(--space-8);">
                New Password</h1>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-48); font-size: 0.95rem;">Initialize your new
                secure credentials.</p>
            <form id="reset-form" style="text-align: left;">
                <div style="margin-bottom: var(--space-40);">
                    <label
                        style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: var(--space-8);">New
                        Secure Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; height: 56px; font-size: 1.1rem;">Initialize Password</button>
            </form>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return showToast("Error", "Invalid or missing token.", "error");
            setButtonLoading(btn, true, "Synchronizing...");
            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token, 
                        new_password: document.getElementById('new-password').value 
                    })
                });
                if (res.ok) {
                    showToast("Success", "Password updated. Redirecting to login...", "success");
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    const err = await res.json();
                    showToast("Error", err.detail || "Link expired or invalid.", "error");
                }
            } catch (err) {
                showToast("Error", "Check your connection.", "error");
            } finally {
                setButtonLoading(btn, false);
            }
        });
    </script>
</body>
</html>
