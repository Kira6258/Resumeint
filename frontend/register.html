<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account — Resumeint | AI Portfolio Builder for CS Students</title>
    <meta name="description" content="Join 500+ CS students building job-ready portfolios. Sign up free — no credit card required. AI generates your project roadmap from your college syllabus.">
    <meta property="og:title" content="Join Resumeint Free — AI Portfolio Builder for Students">
    <meta property="og:description" content="Paste your syllabus, get a production-ready project roadmap in minutes. Free for students.">
    <link rel="canonical" href="https://resumeint.com/register.html">
    <link rel="stylesheet" href="css/style.css?v=51.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body class="auth-body">
    <div class="auth-bg-glow"></div>
    <main class="auth-main-wrap fade-up">
        <div class="auth-card glass-card">
            <a href="/" class="logo auth-logo"><img src="assets/logo.png" alt="Resumeint" style="height: 64px;"></a>
            <h1 class="auth-headline">Start Building Free</h1>
            <p class="auth-sub">Join 500+ students turning their syllabi into job-ready portfolios.</p>
            <form id="register-form" class="auth-form-block">
                <div class="form-group">
                    <label class="form-label-v2">Full Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label-v2">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="architect@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label-v2">Secure Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="reg-password" class="form-input" placeholder="Min 8 characters" required minlength="8">
                        <button type="button" class="password-toggle" id="toggle-reg-pass">👁️</button>
                    </div>
                    <div id="password-strength" style="font-size:0.7rem;margin-top:var(--space-8);color:var(--text-tertiary);">
                        Must be at least 8 characters long.
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-glow auth-submit-btn" id="reg-submit-btn">Create My Account</button>
            </form>
            <div class="auth-divider">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>
            <a href="/auth/google" class="btn btn-outline google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                Continue with Google
            </a>
            <div class="auth-social-proof">
                <span class="asp-dot"></span><span class="asp-dot"></span><span class="asp-dot"></span>
                <span class="asp-text">500+ students already building · Free forever plan</span>
            </div>
            <div class="auth-footer-note">
                Already have an account? <a href="login.html" class="auth-link-gold">Login Here</a>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        // Password Toggle
        const passInput = document.getElementById('reg-password');
        const passToggle = document.getElementById('toggle-reg-pass');
        const strengthHint = document.getElementById('password-strength');
        passToggle.onclick = () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            passToggle.innerText = isPass ? '🔒' : '👁️';
        };
        // Real-time validation
        passInput.addEventListener('input', () => {
            const val = passInput.value;
            if (val.length < 8) {
                strengthHint.style.color = 'var(--text-tertiary)';
                strengthHint.innerText = 'Must be at least 8 characters long.';
            } else {
                strengthHint.style.color = '#4CAF50';
                strengthHint.innerText = 'Password strength acceptable ✅';
            }
        });
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passInput.value;
            if (password.length < 8) {
                showToast("Weak Password", "Password must be at least 8 characters.", "warning");
                return;
            }
            const nameVal = document.getElementById('reg-name').value.trim();
            if (nameVal.length < 2) {
                showToast("Invalid Name", "Please enter a valid full name (at least 2 characters).", "warning");
                return;
            }

            const btn = document.getElementById('reg-submit-btn');
            setButtonLoading(btn, true, "Provisioning Profile...");
            try {
                // 1. Create the account
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameVal,
                        email: document.getElementById('reg-email').value,
                        password: password
                    })
                });
                
                if (res.ok) {
                    // 2. Automatically log the user in to get the JWT token
                    const loginRes = await fetch('/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: document.getElementById('reg-email').value,
                            password: password
                        })
                    });

                    if (loginRes.ok) {
                        const data = await loginRes.json();
                        if (data.access_token) {
                            localStorage.setItem('token', data.access_token);
                            showToast("Welcome to Resumeint! 🎉", "Your account is ready. Let's build!", "success");
                            setTimeout(() => window.location.href = 'dashboard.html', 1200);
                        } else {
                            // Fallback: redirect to login if no token returned
                            showToast("Account Created!", "Please log in to continue.", "success");
                            setTimeout(() => window.location.href = 'login.html', 1500);
                        }
                    } else {
                        // Registration worked but login failed
                        showToast("Account Created!", "Please log in to continue.", "success");
                        setTimeout(() => window.location.href = 'login.html', 1500);
                    }
                } else {
                    const err = await res.json();
                    showToast("Error", err.detail || "Email may already be registered.", "error");
                }
            } catch (err) {
                showToast("Error", "Check your connection.", "error");
            } finally {
                setButtonLoading(btn, false);
            }
        });
    </script>
    <style>
    .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        background-image: radial-gradient(at 50% 0%, rgba(212, 162, 78, 0.06) 0, transparent 60%);
        padding: var(--space-24);
    }
    .auth-bg-glow {
        position: fixed; top: 0; left: 50%; transform: translateX(-50%);
        width: 600px; height: 300px;
        background: radial-gradient(circle, rgba(212, 162, 78, 0.07) 0, transparent 70%);
        pointer-events: none; z-index: 0;
    }
    .auth-main-wrap { width: 100%; max-width: 460px; position: relative; z-index: 1; }
    .auth-card { padding: var(--space-48); text-align: center; }
    .auth-logo { justify-content: center; margin-bottom: var(--space-32); }
    .auth-headline {
        font-family: var(--font-display); font-size: 1.6rem; font-weight: 800;
        letter-spacing: -0.03em; margin-bottom: var(--space-8);
    }
    .auth-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: var(--space-32); }
    .auth-form-block { text-align: left; display: flex; flex-direction: column; gap: var(--space-20); margin-bottom: var(--space-24); }
    .auth-submit-btn { width: 100%; height: 52px; font-size: 1rem; }
    .auth-footer-note { margin-top: var(--space-32); font-size: 0.875rem; color: var(--text-secondary); }
    .auth-link-gold { color: var(--accent-gold); font-weight: 700; }
    .auth-link-gold:hover { color: var(--text-primary); }
    .auth-divider { display: flex; align-items: center; gap: var(--space-16); margin: var(--space-24) 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border-muted); }
    .divider-text { font-size: 0.7rem; font-weight: 800; color: var(--text-tertiary); letter-spacing: 0.08em; }
    .auth-social-proof {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin: var(--space-24) 0 var(--space-16);
    }
    .asp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-gold); opacity: 0.5; }
    .asp-text { font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500; }
    @media (max-width: 480px) {
        .auth-card { padding: var(--space-24); }
    }
    </style>
</body>
</html>
