<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Resumeint</title>
    <link rel="stylesheet" href="css/style.css?v=50.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body class="auth-body">
    <div class="auth-bg-glow"></div>
    <main class="auth-main-wrap fade-up">
        <div class="auth-card glass-card">
            <a href="index.html" class="logo auth-logo"><img src="assets/logo.png" alt="Resumeint" style="height: 64px;"></a>
            <h1 class="auth-headline">Access Resumeint</h1>
            <p class="auth-sub">Continue architecting your engineering career.</p>
            <form id="login-form" class="auth-form-block">
                <div class="form-group">
                    <label class="form-label-v2">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="architect@example.com" required>
                </div>
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-8);">
                        <label class="form-label-v2" style="margin:0;">Password</label>
                        <a href="forgot-password.html" style="font-size:0.75rem;color:var(--accent-gold);font-weight:700;">Forgot?</a>
                    </div>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="toggle-login-pass">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-glow auth-submit-btn" id="login-submit-btn">Login to Dashboard</button>
            </form>
            <div class="auth-divider">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>
            <a href="/auth/google" class="btn btn-outline google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                Sign in with Google
            </a>
            <div class="auth-footer-note">
                New to Resumeint? <a href="register.html" class="auth-link-gold">Create Account</a>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        // Password Toggle
        const passInput = document.getElementById('login-password');
        const passToggle = document.getElementById('toggle-login-pass');
        passToggle.onclick = () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            passToggle.innerText = isPass ? '🔒' : '👁️';
        };
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            setButtonLoading(btn, true, "Authenticating...");
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    window.location.href = 'dashboard.html';
                } else {
                    const err = await res.json();
                    showToast("Access Denied", err.detail || "Invalid credentials.", "error");
                }
            } catch (err) {
                showToast("Error", "Check your connection.", "error");
            } finally {
                setButtonLoading(btn, false);
            }
        });
    </script>
    <style>
    .auth-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        background-image: radial-gradient(at 50% 0%, rgba(212,162,78,0.06) 0, transparent 60%);
        padding: var(--space-24);
    }
    .auth-bg-glow {
        position: fixed; top: 0; left: 50%; transform: translateX(-50%);
        width: 600px; height: 300px;
        background: radial-gradient(circle, rgba(212,162,78,0.07) 0, transparent 70%);
        pointer-events: none; z-index: 0;
    }
    .auth-main-wrap {
        width: 100%; max-width: 460px; position: relative; z-index: 1;
    }
    .auth-card { padding: var(--space-48); text-align: center; }
    .auth-logo { justify-content: center; margin-bottom: var(--space-32); }
    .auth-headline {
        font-family: var(--font-display); font-size: 1.6rem; font-weight: 800;
        letter-spacing: -0.03em; margin-bottom: var(--space-8);
    }
    .auth-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: var(--space-32); }
    .auth-form-block { text-align: left; display: flex; flex-direction: column; gap: var(--space-20); margin-bottom: var(--space-24); }
    .auth-submit-btn { width: 100%; height: 52px; font-size: 1rem; }
    .auth-footer-note { margin-top: var(--space-32); font-size: 0.875rem; color: var(--text-secondary); }
    .auth-link-gold { color: var(--accent-gold); font-weight: 700; }
    .auth-link-gold:hover { color: var(--text-primary); }
    .auth-divider { display: flex; align-items: center; gap: var(--space-16); margin: var(--space-24) 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border-muted); }
    .divider-text { font-size: 0.7rem; font-weight: 800; color: var(--text-tertiary); letter-spacing: 0.08em; }
    </style>
</body>
</html>
